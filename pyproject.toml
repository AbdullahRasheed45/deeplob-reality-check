[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobrc"
version = "0.1.0"
description = "DeepLOB Reality Check: how much of a published LOB model's edge survives costs, latency and new data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "pyyaml>=6",
  "plotly>=5.20",
  "matplotlib>=3.8",
  "websockets>=14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
lobrc = "lobrc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "collector"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lobrc", "synth"]

[tool.ruff.lint.per-file-ignores]
# The collector is standalone, already deployed code; style-only rules are not worth touching it.
"collector/*" = ["UP041", "I001", "E501", "E741", "B905"]
